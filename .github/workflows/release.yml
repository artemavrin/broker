name: Release

# Релиз выпускается изменением файла VERSION в main, а не пушем тега: тег
# создаёт сам workflow через gh, и он гарантированно указывает на коммит,
# прошедший проверки. VERSION — единственный источник номера версии: он же
# попадает в бинарь (broker version) и в имена архивов.
on:
  push:
    branches: ["main"]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write # нужно, чтобы создать тег, релиз и приложить файлы

jobs:
  # Публикация идёт только после того же набора проверок, что и обычная сборка.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Номер версии
        id: v
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          case "$version" in
            v[0-9]*) ;;
            *) echo "VERSION должен содержать тег вида v1.2.3, а содержит: '$version'" >&2
               exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Повторный запуск на неизменённой версии не должен перезаписывать релиз.
      - name: Проверка, что версия ещё не выпущена
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Релиз $VERSION уже опубликован — поднимите VERSION." >&2
            exit 1
          fi

      # CGO отключён, поэтому бинарь статический и кросс-сборка не требует
      # тулчейна для целевой платформы. Миграции вшиты, так что в архиве
      # лежит один файл. Под Windows — zip: tar там есть не везде.
      - name: Сборка под linux, darwin и windows
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}" arch="${target#*/}"
            bin=broker; [ "$os" = windows ] && bin=broker.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "dist/$bin" ./cmd/broker
            name="broker_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd dist && zip -q "$name.zip" "$bin")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$bin"
            fi
            rm "dist/$bin"
          done

      # Установщик для Windows кладётся в релиз, чтобы ставить одной строкой
      # по постоянному адресу releases/latest/download/install.ps1 — и чтобы
      # скрипт всегда соответствовал бинарю той же версии.
      - name: Установщик для Windows
        run: cp deploy/install.ps1 dist/

      - name: Контрольные суммы
        run: cd dist && sha256sum *.tar.gz *.zip install.ps1 > checksums.txt

      # gh предустановлен на раннере, поэтому сторонний экшен не нужен. Тег
      # создаётся здесь же, на текущем коммите.
      - name: Публикация релиза
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes
